[project]
name = "mastervolt-yms"
description = "Private web app to monitor and control a boat's Mastervolt and DALY equipment"
requires-python = ">=3.12"
dynamic = ["version"]

[tool.black]
line-length = 140
target-version = ["py312"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["static", "docs"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify (a few), no bare/blind excepts without a reason
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = [
    "E501",    # line length is black's job
    "SIM105",  # try/except/pass is often clearer in the hardware code than contextlib.suppress
    "SIM108",  # no ternaries just to save lines
    "BLE001",  # background loops catch Exception on purpose (a failed pass must not end the loop); each one is logged or commented
    "B008",    # FastAPI's Depends() in argument defaults is the framework's idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "E701", "E702", "E741"]
"tools/*" = ["SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mastervolt", "tests"]
